services:

  db:
    image: mysql:8
    container_name: router-db

    environment:
      MYSQL_DATABASE: router
      MYSQL_ROOT_PASSWORD: root

    ports:
      - "3308:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    restart: always

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  app:
    build: .
    container_name: router-app

    ports:
      - "9090:9090"

    depends_on:
      db:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/router
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

    restart: always

volumes:
  mysql_data: