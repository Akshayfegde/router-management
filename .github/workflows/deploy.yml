name: Router Management CI/CD

on:
  push:
    branches: [ "main" ]  # मेन ब्रांचवर कोड पुश झाला की हे सुरू होईल

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # १. Java 21 सेटअप करा (तुमच्या pom.xml नुसार)
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    # २. Maven ने JAR फाईल बिल्ड करा
    - name: Build with Maven
      run: mvn clean package -DskipTests

    # ३. Docker Hub लॉगिन (Secrets वापरावे लागतील)
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # ४. Docker Image बनवून पुश करा
    - name: Build and Push Docker Image
      run: |
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/router-app:latest .
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/router-app:latest